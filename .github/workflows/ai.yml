name: AI-build
on:
  schedule:
    - cron: '0 1 * * 0' # 1 AM on Sunday
  push:
    branches:
      - ai.*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
      - name: Setup Maven
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.9.16
      - name: Build VSC
        run: |
          corepack enable
          pnpm install
          pnpm run build:production
          pnpm run package
      - name: Build with Maven
        run: |
          export HOST_UID="$(id -u)"
          export HOST_GID="$(id -g)"
          mvn clean verify -f aitest/pom.xml -ntp -fail-at-end
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_TOKEN }}
          TESTCONTAINERS_REUSE_ENABLE: 'false'
      - name: Print AI test report
        if: always()
        run: |
          report="aitest/ai-dev-tests/target/ai-test-report.tsv"
          {
            echo "## AI test report"
            echo
            echo 'Test file: `aitest/ai-dev-tests/test/ch/ivyteam/smart/core/copilot/CopilotIntegrationTest.java`'
            echo
            if [[ -s "$report" ]]; then
              echo '| Test | Input tokens | Output tokens | Tools used |'
              echo '| --- | ---: | ---: | --- |'
              tail -n +2 "$report" | while IFS=$'\t' read -r test input output tools; do
                [[ -z "$test" ]] && continue
                [[ -z "$tools" ]] && tools="None"
                echo "| \`$test\` | $input | $output | $tools |"
              done
            else
              echo 'No AI test metrics were recorded.'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Archive test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          retention-days: 5
          path: |
            ci-user-data/logs/**/*
            ci-user-data/code-insiders.log
            ci-user-data/xvfb-errors.log
            ci-user-data/process*.log
            **/*.log
            aitest/ai-dev-tests/target/ai-test-report.tsv
            aitest/ai-dev-tests/target/surefire-reports/*.xml
      - name: Fail if AI tests failed
        if: always()
        run: |
          if find aitest/ai-dev-tests/target/surefire-reports -name 'TEST-*.xml' -print0 \
            | xargs -0 grep -l -E '<(failure|error)' | grep -q .; then
            echo "AI tests failed; see the report above and the archived test reports."
            exit 1
          fi
      # - name: Publish Test Results
      #   uses: EnricoMi/publish-unit-test-result-action@v2
      #   if: always()
      #   with:
      #     files: |
      #       aitest/*/target/*-reports/*.xml
      #       !aitest/*/target/*-reports/failsafe-summary.xml
      #     action_fail: true
