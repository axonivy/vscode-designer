name: AI-build
on:
  schedule:
    - cron: '0 1 * * 0' # 1 AM on Sunday
  push:
    branches:
      - ai.tests
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  copilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: Setup Maven
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.9.13
      - name: Build VSC
        run: |
          corepack enable
          pnpm install
          pnpm run build:production
          pnpm run package
      - name: Start VS Code host with extension and MCP
        run: |
          bash .github/workflows/mcp.sh $PWD/playwright/tests/workspaces
      - name: Verify VS Code MCP is still alive
        run: |
          PID_FILE="$PWD/ci-user-data/code-insiders.pid"
          if [ ! -f "$PID_FILE" ]; then
            echo "Missing VS Code PID file: $PID_FILE" >&2
            exit 1
          fi
          VSCODE_PID="$(cat "$PID_FILE")"
          if ! kill -0 "$VSCODE_PID" 2>/dev/null; then
            echo "VS Code process is not alive (PID: $VSCODE_PID)" >&2
            exit 1
          fi
          grep -q '"url": "http://127.0.0.1:32140/mcp"' "$PWD/aitest/.mcp.json"
          curl -fsS --retry 10 --retry-delay 2 --retry-all-errors http://127.0.0.1:32140/health
      - name: Build with Maven
        run: |
          cd aitest       
          mvn clean verify -ntp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCODE_MCP_URI: http://127.0.0.1:32140/mcp
      - name: Debug
        if: failure()
        run: |
          echo "Debugging test reports"
          echo "pwd: $PWD"
          tree -la
      - name: Archive test reports
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          retention-days: 5
          path: |
            ci-user-data/logs/**/*
            **/*.log
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            */target/*-reports/*.xml
            !*/target/*-reports/failsafe-summary.xml
          action_fail: true
