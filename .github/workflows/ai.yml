name: AI-build
on:
  schedule:
    - cron: '0 1 * * 0' # 1 AM on Sunday
  push:
    branches:
      - ai.tests
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  copilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: Setup Maven
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.9.13
      - name: Build VSC
        run: |
          corepack enable
          pnpm install
          pnpm run build:production
          pnpm run package
      - name: Install code-server
        run: |
          curl -fsSL https://code-server.dev/install.sh | sh
          mkdir -p .ci-extensions
          code-server --extensions-dir "$PWD/.ci-extensions" --install-extension vscjava.vscode-java-pack
          code-server --extensions-dir "$PWD/.ci-extensions" --install-extension extension/vscode-designer*.vsix
          code-server --extensions-dir "$PWD/.ci-extensions" --list-extensions
      - name: Install Axon Ivy Engine
        run: |
          pnpm run engine:download https://dev.axonivy.com/permalink/sprint/axonivy-engine.zip
          if ! grep -qxF -- '-Ddev.mode=true' AxonIvyEngine/configuration/jvm.options; then
            echo '-Ddev.mode=true' >> AxonIvyEngine/configuration/jvm.options
          fi
          
      - name: Start VS Code host with extension and MCP
        run: |
          mkdir -p .ci-user-data/User
          cat > .ci-user-data/User/settings.json << EOF
          {
            "java.jdt.ls.java.home": "${JAVA_HOME}",
            "axonivy.localMcp.enabled": true,
            "axonivy.localMcp.host": "127.0.0.1",
            "axonivy.localMcp.port": 32140,
            "axonivy.localMcp.exposeAllTools": false
          }
          EOF

          echo "JAVA_HOME=$JAVA_HOME"
          cat "$JAVA_HOME/release" || true

          nohup bash -c 'AxonIvyEngine/bin/AxonIvyEngine &'> ivy-engine-console.out

          nohup code-server --bind-addr 127.0.0.1:3000 --auth none --disable-telemetry --disable-update-check --disable-workspace-trust --extensions-dir "$PWD/.ci-extensions" --user-data-dir "$PWD/.ci-user-data" "$PWD/playwright/tests/workspaces/prebuiltProject" > code-server.out 2>&1 &

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:32140/health > /dev/null; then
              echo "MCP endpoint is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "MCP endpoint did not become healthy in time"
          tail -n 200 code-server.out || true
          exit 1
      - name: Build with Maven
        run: |
          cd aitest       
          mvn clean verify -ntp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCODE_MCP_URI: http://127.0.0.1:32140/mcp
      - name: Print VS Code host logs on failure
        if: failure()
        run: |
          echo "=== code-server.out ==="
          tail -n 300 code-server.out || true
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            */target/*-reports/*.xml
            !*/target/*-reports/failsafe-summary.xml
          action_fail: true
      # - name: Install Copilot CLI
      #   run: npm install -g @github/copilot
      # - name: Run Copilot
      #   run: copilot --yolo -p "Summarize the changes in this commit"
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
