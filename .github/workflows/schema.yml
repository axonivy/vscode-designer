name: Schema-freshness
on:
  push:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Compare skill schemas with hosted schemas
        run: |
          corepack enable
          pnpm --dir extension check:schemas
