name: AI skill install
on:
  push:
    branches:
      - master
      - release/*
    paths:
      - '.github/workflows/gh-skill-install.yml'
      - 'extension/src/ai/skills/**'
      - 'aitest/skill-install.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Verify gh skill install includes schemas
        shell: bash
        run: |
          gh --version
          install_dir="$HOME/.copilot/skills"
          bash aitest/skill-install.sh "$install_dir"
